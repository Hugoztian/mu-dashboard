@media (max-width:1000px){.hstats{grid-template-columns:repeat(2,minmax(0,1fr))}.hstat.live1{grid-column:1/-1}.bar{gap:12px}.brand .bn{display:none}}
@media (max-width:700px){.bar{padding:0 14px;height:48px}nav{justify-content:flex-start}.hero{padding:26px 16px 4px}.hero h1{font-size:32px}.hero .sub{font-size:13px}
 main{padding:12px 16px 30px}h2{font-size:30px;margin:18px 0 16px}h3{font-size:17px}.card{padding:16px;border-radius:16px}.hstat{border-radius:16px;padding:12px 14px}.hstat .v{font-size:22px}

<script>
const D = window.MU_DATA, Q = D.meta.quarters;
const TABS=[['overview','Overview','概览'],['financials','Financials','财务'],['revenue','Revenue & Pricing','营收与价格'],['capacity-capex','Capacity & Capex','产能与资本开支'],['buybacks','Buybacks & CHIPS','回购与 CHIPS'],['insiders','Insiders','内部人交易'],['calls','Earnings Calls','业绩电话会'],['estimates','Wall Street Estimates','华尔街预期'],['sources','Sources & Live feed','来源与实时数据']];
const $=s=>document.querySelector(s);
const fmt=(v,d=0)=>v==null?'n/a':Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fB=v=>v==null?'n/a':'$'+(v/1000).toFixed(1)+'B';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify=s=>esc(s).replace(/(https?:\/\/[^\s;,)，；）]+)/g,m=>`<a href="${m}" target="_blank" rel="noopener">${LANG==='zh'?'链接':'link'}</a>`);
/* ---------- language: English ⇄ Simplified Chinese (localStorage 'mu-lang'; html[data-lang]) ----------
   UI text in this file: L(english, chinese). Text that comes from data.js: tr(s), using the D.zh map that build_data.py
   generates (English template with numbers as ⟦⟧ → Chinese template). Quotes keep the English original + "译文：" line. */
let LANG=document.documentElement.dataset.lang==='zh'?'zh':'en';
const L=(en,zh)=>LANG==='zh'?zh:en;
const ZHT=D.zh||{}, TOKR=/\d+(?:[.,]\d+)*/g;
const MON={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Sept:9,Oct:10,Nov:11,Dec:12}, MRX='(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sept|Sep|Oct|Nov|Dec)[a-z]*\\.?';
const DRX=[ // English date forms → Chinese (only applied in Chinese mode)
  [new RegExp('\\b(\\d{1,2})[–-](\\d{1,2}) '+MRX+' (\\d{4})\\b','g'),(m,a,b,mo,y)=>`${y}年${MON[mo]}月${a}–${b}日`],
  [new RegExp('\\b(\\d{1,2})[- ]'+MRX+'[- ,]+(\\d{4})\\b','g'),(m,d,mo,y)=>`${y}年${MON[mo]}月${+d}日`],
  [new RegExp('\\b'+MRX+' (\\d{1,2}),? (\\d{4})\\b','g'),(m,mo,d,y)=>`${y}年${MON[mo]}月${+d}日`],
  [new RegExp('\\b'+MRX+'-(\\d{2})-(\\d{2})\\b','g'),(m,mo,d,y)=>`20${y}年${MON[mo]}月${+d}日`],
  [new RegExp('\\b'+MRX+'[- ](\\d{4})\\b','g'),(m,mo,y)=>`${y}年${MON[mo]}月`],
  [new RegExp('\\b'+MRX+"(?:-| ')(2\\d|3\\d)\\b",'g'),(m,mo,y)=>`20${y}年${MON[mo]}月`],
  [new RegExp('\\b(\\d{1,2}) '+MRX+'(?![a-z])','g'),(m,d,mo)=>`${MON[mo]}月${+d}日`]];
const zhDate=s=>DRX.reduce((a,[r,f])=>a.replace(r,f),s);
function tr(s){ if(LANG!=='zh'||s==null) return s; s=String(s); const t=ZHT[s.replace(TOKR,'⟦⟧')]; if(t==null) return s;
  const v=s.match(TOKR)||[], o=t.replace(/⟦(\d+)⟧/g,(m,i)=>v[+i]??'');
  return o.startsWith(s)?s+zhDate(o.slice(s.length)):zhDate(o); }   // an English original kept in front of "译文：" is never altered
const E=s=>esc(tr(s)).replace(/\n/g,'<br>');            // translated data text, escaped
const H=s=>linkify(tr(s)).replace(/\n/g,'<br>');        // translated data text, escaped + links
const NA=()=>L('n/a','暂无');

function tableHTML(t,opt={}){
  let h='';

  if(t.pre&&t.pre.length) h+=`<div class="mut" style="font-size:12px;margin-bottom:6px">${t.pre.map(E).join('<br>')}</div>`;
  h+=`<div class="tblwrap"><table class="${opt.wrap?'wrapt':''}"><thead><tr>${t.columns.map((c,i)=>`<th data-i="${i}">${E(c).replace(/ \(|（/,m=>'<br>'+(m==='（'?'（':'('))}</th>`).join('')}</tr></thead><tbody>`;
  for(const r of t.rows){
    if(!Array.isArray(r)){h+=`<tr class="sec"><td colspan="${t.columns.length}">${E(r.section)}</td>${''}</tr>`;continue;}
    h+='<tr>'+r.map((c,i)=>{const [txt,cls]=Array.isArray(c)?c:[c,''];const s=String(txt??'');
      const w=(s.length>40||opt.wrap)?' wrap':'';
      const body=/^https?:\/\//.test(s)?`<a href="${esc(s)}" target="_blank" rel="noopener">${L('link','链接')}</a>`:H(s);
      return `<td class="${cls||''}${w}">${body}</td>`}).join('')+'</tr>';
  }
  h+='</tbody></table></div>';
  if(t.notes&&t.notes.length) h+=`<ul class="notes">${t.notes.map(n=>`<li>${H(n)}</li>`).join('')}</ul>`;
  return h;
}

function tightCols(root){ markDates(root); (root||document).querySelectorAll('table').forEach(tb=>{
  const head=tb.tHead&&tb.tHead.rows[0]; if(!head) return; const n=head.cells.length;
  const rows=[...(tb.tBodies[0]?.rows||[])].filter(r=>r.cells.length===n);
  for(let i=0;i<n;i++){
    const vals=rows.slice(0,400).map(r=>r.cells[i].textContent.trim()).filter(v=>v&&!/^(n\/a|n\/p|—|–|-)$/i.test(v));
    const hdr=head.cells[i].textContent.trim();
    let code=CODE_HDR.test(hdr);
    if(!code&&vals.length){const mx=Math.max(...vals.map(v=>v.length)); const txt=vals.filter(v=>!NUMLIKE.test(v)&&/[A-Za-z]/.test(v)).length/vals.length; code=mx<=6&&txt>=0.5&&!vals.some(v=>/\s/.test(v));}

const ZDR=/\d{4}年\d{1,2}月(?:\d{1,2}(?:[–-]\d{1,2})?日)?|\d{1,2}月\d{1,2}(?:[–-]\d{1,2})?日/g;
function nwZh(root){ if(LANG!=='zh'||!root) return; const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement; if(!p||p.closest('.nw,.dt,script,style,canvas,option,.tvchart,.tvq')) return NodeFilter.FILTER_REJECT; ZDR.lastIndex=0; return ZDR.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_SKIP;}});
  const ns=[]; while(w.nextNode()) ns.push(w.currentNode);
  ns.forEach(n=>{const f=document.createDocumentFragment(); let last=0, s=n.nodeValue; s.replace(ZDR,(m,i)=>{ if(i>last) f.appendChild(document.createTextNode(s.slice(last,i))); const sp=document.createElement('span'); sp.className='nw'; sp.textContent=m; f.appendChild(sp); last=i+m.length; return m;}); if(last<s.length) f.appendChild(document.createTextNode(s.slice(last))); n.parentNode.replaceChild(f,n);}); }

async function pollQuote(){
  if(document.visibilityState==='hidden') return;
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(QUOTE_API+(QUOTE_API.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store',signal:ctl.signal}); clearTimeout(to);
    const q=await r.json(); if(!q||!q.ok||!q.main) throw new Error('bad quote');
    LQ.fails=0; LQ.ok=true; LQ.last=q; tvFallback(false); renderQuote(q);
  }catch(e){
    LQ.fails++;
    if(!LQ.ok||LQ.fails>=4) tvFallback(true);
    else if(LQ.last) renderQuote({...LQ.last,stale:true});
  }
}

  // 15 s while the endpoint answers; back off to 30–60 s while it is unreachable (TradingView fallback shown meanwhile)

}

  const ROLE={chair_ceo:L('Chairman & CEO','董事长兼首席执行官'),lid:L('Lead Independent Director','首席独立董事'),ind:L('Independent director','独立董事')};
  const COM={audit:L('Audit','审计'),comp:L('Compensation','薪酬'),fin:L('Finance','财务'),gov:L('Governance & Sustainability','治理与可持续发展'),sec:L('Security','安全')};
  const NAT=n=>({'Trust':L('trust','信托'),'GRAT':L('GRAT','设保留年金信托 GRAT')}[n]||n||L('indirect','间接'));
  const P=B.proxy, sh=v=>v==null?NA():fmt(v), M=v=>v==null?NA():'$'+(v/1e6).toFixed(2)+'M';
  const pc=v=>v==null?NA():(v>0&&v<0.001?'<0.001%':v.toFixed(3)+'%');
  const rows=B.rows.map(r=>{
    const f=r.f4, a=r.awards;

    const pr=r.proxy?`${fmt(r.proxy.total)}${r.proxy.right?`<div class="sm mut">${L(`incl. ${fmt(r.proxy.right)} right to acquire`,`含 60 日内可取得的 ${fmt(r.proxy.right)} 股`)}</div>`:''}`:`<span class="mut">${NA()} — ${L('not in proxy (joined later)','委托书未列（其后加入）')}</span>`;
    let aw=[];
    if(r.awards_txt) aw.push(E(r.awards_txt));
    if(a){
      a.rs_unvested.forEach(x=>aw.push(L(`${fmt(x.shares)} restricted shares vest <span class="nw">${x.vest}</span> (counted in holdings)`,`${fmt(x.shares)} 股限制性股票于 <span class="nw">${x.vest}</span> 归属（已计入持股）`)));
      if(a.rsu>0){ const u=a.rsu_unvested.reduce((s,x)=>s+x.shares,0), uv=a.rsu_unvested.map(x=>x.vest).sort()[0];
        aw.push(L(`${fmt(a.rsu)} RSUs (not in holdings)`,`${fmt(a.rsu)} 个 RSU（未计入持股）`)+(u?L(`, of which ${fmt(u)} vest <span class="nw">${uv}</span>`,`，其中 ${fmt(u)} 个于 <span class="nw">${uv}</span> 归属`):'')+(a.rsu_deferred?L('; deferred: shares delivered after leaving the Board','；递延：离任董事会后交付股份'):'')); }
      if(!aw.length) aw.push(`<span class="mut">${L('None open per Form 4','据 Form 4 无未归属/递延奖励')}</span>`);

    return `<tr><td>${name}</td><td>${ROLE[r.role]||esc(r.role)}</td><td>${com}</td><td>${esc(r.since)}</td><td>${hold}</td><td>${pc(r.pct)}</td><td>${M(r.value)}</td><td>${pr}</td><td><div class="sm">${aw.join('<br>')}</div></td></tr>`;}).join('');

    :['Name','Board role','Committees','Director since','Current holdings (shares, Form 4)','% of shares outstanding',`Value at ${nw('$'+fmt(B.close,2))} close`,`Proxy beneficial ownership (${nw(P.own_as_of)})`,'Unvested / deferred awards'];
  const notes=[], so=B.so;

  notes.push(L(`Current holdings = shares of Common Stock owned after each director's most recent reported transaction or holding on Form 4, summed over direct and indirect lines (latest figure per line across all of the director's Form 4s; an indirect line not reported for over 400 days before their latest Form 4 is treated as closed). RSUs are shown separately and are not counted. Refreshed from SEC EDGAR on every build.`,`当前持股 = 各董事最近一次 Form 4 申报的交易后（或持有）普通股数，直接与间接持股合计（取该董事所有 Form 4 中每一持股类别的最新数字；若某间接持股类别在其最近一份 Form 4 之前超过 400 天未再申报，则视为已结清）。RSU 单独列示，不计入持股。每次生成时从 SEC EDGAR 刷新。`));

  notes.push(L(`Proxy column: “Total beneficial ownership” from the <span class="nw">${P.filed}</span> DEF 14A (as of <span class="nw">${P.own_as_of}</span>; includes unvested restricted stock and shares the director could acquire within 60 days, e.g. deferred RSUs). All directors and the CEO each held less than 1% then. ${lnk(P.url,'DEF 14A')}`,`委托书列：取自 <span class="nw">${P.filed}</span> 的 DEF 14A“实益持股合计”（截至 <span class="nw">${P.own_as_of}</span>；包括未归属限制性股票及董事可于 60 日内取得的股份，如递延 RSU）。当时每位董事及 CEO 的持股比例均低于 1%。${lnk(P.url,'DEF 14A')}`));
  notes.push(L(`† Security Committee: listed in the Nov 2025 proxy (Linnie M. Haynesworth, Chair; A. Christine Simons). micron.com's governance page (checked <span class="nw">${B.web_checked}</span>) lists only the Audit, Compensation, Finance and Governance & Sustainability committees, so its current status is n/a.`,`† 安全委员会：见于 2025 年 11 月委托书（Linnie M. Haynesworth 任主席；A. Christine Simons）。micron.com 治理页面（核查于 <span class="nw">${B.web_checked}</span>）仅列出审计、薪酬、财务及治理与可持续发展委员会，故其现状暂无。`));
  notes.push(L(`Roles and committees: proxy, updated with micron.com's governance and leadership pages and 8-K filings since the proxy (curated review <span class="nw">${esc(B.reviewed_sgt)}</span>). ${lnk(B.governance_url,'Governance')} · ${lnk(B.leadership_url,'Leadership')}`,`职务与委员会：依据委托书，并按 micron.com 治理与领导层页面及委托书之后的 8-K 更新（人工核查于 <span class="nw">${esc(B.reviewed_sgt)}</span>）。${lnk(B.governance_url,'治理')} · ${lnk(B.leadership_url,'领导层')}`));
  B.rows.filter(r=>r.note).forEach(r=>notes.push(`<b>${esc(r.name)}</b>${L(': ','：')}${E(r.note)}`));

  <h3>${L('Source documents','来源文件')}</h3><div class="tblwrap"><table class="wrapt"><thead><tr><th>${L('Source','来源')}</th><th>URL</th></tr></thead><tbody>${D.sources.map(s=>`<tr><td>${E(s[0])}</td><td><a href="${esc(s[1])}" target="_blank" rel="noopener">${esc(s[1])}</a></td></tr>`).join('')}</tbody></table></div>
  <h3>${L('Build log','构建日志')}</h3><ul class="notes">${D.meta.build_log.map(l=>`<li>${E(l)}</li>`).join('')}</ul>`;
}
/* ---------- routing ---------- */
const R={overview,financials,revenue,'capacity-capex':capacityCapex,buybacks,insiders,calls,estimates,sources}, done={};
const ALIAS={capacity:'capacity-capex',capex:'capacity-capex'}; // old #capacity / #capex links land on the merged tab, at their section
function route(){let [t,sub]=(location.hash.slice(1)||'overview').split('/');const anchor=ALIAS[t]?t:null; if(anchor){t=ALIAS[t]; history.replaceState(null,'','#'+t);} const tab=R[t]?t:'overview';
  document.querySelectorAll('section').forEach(s=>s.classList.toggle('on',s.id==='s-'+tab));
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.t===tab));
  if(tab==='financials') financials(sub||'is'); else if(!done[tab]){R[tab]();done[tab]=1;} window.scrollTo(0,0); if(anchor&&anchor!=='capacity'){const e=document.getElementById(anchor); if(e) e.scrollIntoView();}
  const nv=$('#nav'),o=nv&&nv.querySelector('a.on'); if(o){const d=o.getBoundingClientRect().left-nv.getBoundingClientRect().left; nv.scrollLeft+=d-(nv.clientWidth-o.offsetWidth)/2;}}
function chrome(){ // static page chrome that depends on the language
  $('#nav').innerHTML=TABS.map(([k,en,zh])=>`<a href="#${k}" data-t="${k}">${L(en,zh)}</a>`).join('');
  $('#bn').textContent=L('Dashboard','研究看板'); $('#h1').textContent=L('Micron Technology (MU) — Research Dashboard','美光科技 (MU) — 研究看板');
  document.querySelector('.brand').setAttribute('aria-label',L('Micron dashboard home','美光看板首页'));
  document.title=L('Micron (MU) Research Dashboard · © 2026 Hugo Tian','美光 (MU) 研究看板 · © 2026 Hugo Tian');
  $('#flag-en').classList.toggle('on',LANG!=='zh'); $('#flag-zh').classList.toggle('on',LANG==='zh');
  $('#langbtn').title=L('Language: English · click for 中文','语言：中文 · 点击切换为 English');
  $('#langbtn').setAttribute('aria-label',L('Switch language to Chinese','切换语言为英文'));
}
chrome();
/* ---------- theme: Auto (system) → Light → Dark; choice kept in localStorage 'mu-theme' ---------- */
function applyTheme(rerender,skipTv){
  const t=document.documentElement.dataset.theme||'auto';
  $('#themelbl').textContent=t==='auto'?L('Auto','自动'):t==='dark'?L('Dark','深色'):L('Light','浅色'); $('#themeic').textContent=t==='auto'?'◐':t==='dark'?'☾':'☀';
  $('#themebtn').title=L(`Theme: ${t==='auto'?'follows your system':t} · click to switch`,`主题：${t==='auto'?'跟随系统':t==='dark'?'深色':'浅色'} · 点击切换`);
  if(!rerender) return;
  DARK=isDark(); chartTheme(); palette();
  Object.keys(charts).forEach(k=>{try{charts[k].destroy();}catch(e){} delete charts[k];});
  // header: the live box follows CSS variables; re-embed the TradingView fallback quote if it is showing
  if(!skipTv){ const showing=$('#tvwrap')&&$('#tvwrap').style.display==='block'; LQ.tv=false; if(showing) tvFallback(true); }
  for(const k in done) delete done[k]; const y=scrollY; route(); window.scrollTo(0,y);
}
$('#themebtn').onclick=()=>{const cur=document.documentElement.dataset.theme||'auto'; const nx=cur==='auto'?'light':cur==='light'?'dark':'auto';
  if(nx==='auto'){delete document.documentElement.dataset.theme; try{localStorage.removeItem('mu-theme');}catch(e){}} else {document.documentElement.dataset.theme=nx; try{localStorage.setItem('mu-theme',nx);}catch(e){}}
  applyTheme(true);};
/* language toggle: EN ⇄ 中文, kept in localStorage 'mu-lang'; re-renders charts, tables and TradingView widgets (zh_CN locale) */
$('#langbtn').onclick=()=>{ LANG=LANG==='zh'?'en':'zh'; const h=document.documentElement; h.dataset.lang=LANG; h.lang=LANG==='zh'?'zh-CN':'en';
  try{localStorage.setItem('mu-lang',LANG);}catch(e){}
  chrome(); header(false); applyTheme(true,true); };
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(!document.documentElement.dataset.theme) applyTheme(true);});
applyTheme(false); header(); window.addEventListener('hashchange',route); route();
</script>
