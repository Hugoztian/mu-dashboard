<script>
const D = window.MU_DATA,
  Q = D.meta.quarters;
const TABS = [['overview', 'Overview', ""], ['financials', 'Financials', ""], ['revenue', 'Revenue & Pricing', ""], ['cycle', 'Memory Cycle', ""], ['capacity-capex', 'Capacity & Capex', ""], ['fabs', 'Fabs & HBM', ""], ['buybacks', 'Buybacks & CHIPS', ""], ['insiders', 'Insiders', ""], ['calls', 'Earnings Calls', ""], ['estimates', 'Wall Street Estimates', ""], ['competition', 'Competition', ""], ['china', 'China Risk', ""], ['people', 'Key People', ""], ['holders', '13F Holders', ""], ['catalysts', 'Catalysts', ""], ['sources', 'Sources & Live feed', ""]];
const $ = s => document.querySelector(s);
const fmt = (v, d = 0) => v == null ? 'n/a' : Number(v).toLocaleString('en-US', {
  minimumFractionDigits: d,
  maximumFractionDigits: d
});
const fB = v => v == null ? 'n/a' : '$' + (v / 1000).toFixed(1) + 'B';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;'
})[c]);
const linkify = s => esc(s).replace(/(https?:\/\/[^\s;,)]+)/g, m => `<a href="${m}" target="_blank" rel="noopener">${'link'}</a>`);
let LANG = "en";
const L = (en, zh) => en;
const ZHT = D.zh || {},
  TOKR = /\d+(?:[.,]\d+)*/g;
const MON = {
    Jan: 1,
    Feb: 2,
    Mar: 3,
    Apr: 4,
    May: 5,
    Jun: 6,
    Jul: 7,
    Aug: 8,
    Sep: 9,
    Sept: 9,
    Oct: 10,
    Nov: 11,
    Dec: 12
  },
  MRX = '(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sept|Sep|Oct|Nov|Dec)[a-z]*\\.?';
const DRX = [
// English date forms → Chinese (only applied in Chinese mode)
[new RegExp('\\b(\\d{1,2})[–-](\\d{1,2}) ' + MRX + ' (\\d{4})\\b', 'g'), (m, a, b, mo, y) => ""], [new RegExp('\\b(\\d{1,2})[- ]' + MRX + '[- ,]+(\\d{4})\\b', 'g'), (m, d, mo, y) => ""], [new RegExp('\\b' + MRX + ' (\\d{1,2}),? (\\d{4})\\b', 'g'), (m, mo, d, y) => ""], [new RegExp('\\b' + MRX + '-(\\d{2})-(\\d{2})\\b', 'g'), (m, mo, d, y) => ""], [new RegExp('\\b' + MRX + '[- ](\\d{4})\\b', 'g'), (m, mo, y) => ""], [new RegExp('\\b' + MRX + "(?:-| ')(2\\d|3\\d)\\b", 'g'), (m, mo, y) => ""], [new RegExp('\\b(\\d{1,2}) ' + MRX + '(?![a-z])', 'g'), (m, d, mo) => ""]];
const zhDate = s => DRX.reduce((a, [r, f]) => a.replace(r, f), s);
function tr(s) {
  return s;
  s = String(s);
  const t = ZHT[s.replace(TOKR, '⟦⟧')];
  if (t == null) return s;
  const v = s.match(TOKR) || [],
    o = t.replace(/⟦(\d+)⟧/g, (m, i) => v[+i] ?? '');
  return o.startsWith(s) ? s + zhDate(o.slice(s.length)) : zhDate(o);
}
const E = s => esc(tr(s)).replace(/\n/g, '<br>'); // translated data text, escaped
const H = s => linkify(tr(s)).replace(/\n/g, '<br>'); // translated data text, escaped + links
const NA = () => L('n/a');
const WQ = {
  'Regular session': "",
  'Pre-market': "",

function boardHTML() {
  const B = D.ins.board;
  if (!B || !B.rows) return `<h3 id="board">${L('Board of Directors')}</h3><p class="mut">${NA()}</p>`;
  const nw = s => `<span class="nw">${esc(s)}</span>`,
    lnk = (u, t) => u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${t}</a>` : '';
  const ROLE = {
    chair_ceo: L('Chairman & CEO'),
    lid: L('Lead Independent Director'),
    ind: L('Independent director')
  };
  const COM = {
    audit: L('Audit'),
    comp: L('Compensation'),
    fin: L('Finance'),
    gov: L('Governance & Sustainability'),
    sec: L('Security')
  };
  const NAT = n => ({
    'Trust': L('trust'),
    'GRAT': L('GRAT')
  })[n] || n || L('indirect');
  const P = B.proxy,
    sh = v => v == null ? NA() : fmt(v),
    M = v => v == null ? NA() : '$' + (v / 1e6).toFixed(2) + 'M';
  const pc = v => v == null ? NA() : v > 0 && v < 0.001 ? '<0.001%' : v.toFixed(3) + '%';
  const rows = B.rows.map(r => {
    const f = r.f4,
      a = r.awards;
    const com = r.committees.length ? r.committees.map(([c, ch, src]) => `<span class="nw">${COM[c] || esc(c)}${ch ? `<b>${L(' (Chair)')}</b>` : ''}${src === 'proxy_only' ? '†' : ''}</span>`).join('<br>') : `<span class="mut">${L('None (management director)')}</span>`;
    let name = `<b>${esc(r.name)}</b>`;
    if (r.joined) name += `<br><span class="pill other">${L('Joined')} ${nw(r.joined)} · ${L('after proxy')}</span> ${lnk(r.joined_url, '8-K')}`;
    let hold = NA();
    if (f) {
      const ind = f.lines.filter(l => l.di === 'I');
      hold = `<b>${fmt(f.shares)}</b>${ind.length ? `<div class="sm mut">${ind.map(l => L(`incl. ${fmt(l.shares)} indirect (${esc(NAT(l.nature))})`)).join(L(', '))}</div>` : ''}<div class="sm mut">${L('as of')} ${nw(f.date)} · Form ${esc(f.form)} ${L('filed')} ${nw(f.filed)} ${lnk(f.url, L('link'))}</div>`;
    }
    const pr = r.proxy ? `${fmt(r.proxy.total)}${r.proxy.right ? `<div class="sm mut">${L(`incl. ${fmt(r.proxy.right)} right to acquire`)}</div>` : ''}` : `<span class="mut">${NA()} — ${L('not in proxy (joined later)')}</span>`;
    let aw = [];
    if (r.awards_txt) aw.push(E(r.awards_txt));
    if (a) {
      a.rs_unvested.forEach(x => aw.push(L(`${fmt(x.shares)} restricted shares vest <span class="nw">${x.vest}</span> (counted in holdings)`)));
      if (a.rsu > 0) {
        const u = a.rsu_unvested.reduce((s, x) => s + x.shares, 0),
          uv = a.rsu_unvested.map(x => x.vest).sort()[0];
        aw.push(L(`${fmt(a.rsu)} RSUs (not in holdings)`) + (u ? L(`, of which ${fmt(u)} vest <span class="nw">${uv}</span>`) : '') + (a.rsu_deferred ? L('; deferred: shares delivered after leaving the Board') : ''));
      }
      if (!aw.length) aw.push(`<span class="mut">${L('None open per Form 4')}</span>`);
    }
    return `<tr><td>${name}</td><td>${ROLE[r.role] || esc(r.role)}</td><td>${com}</td><td>${esc(r.since)}</td><td>${hold}</td><td>${pc(r.pct)}</td><td>${M(r.value)}</td><td>${pr}</td><td><div class="sm">${aw.join('<br>')}</div></td></tr>`;
  }).join('');
  const hdr = ['Name', 'Board role', 'Committees', 'Director since', 'Current holdings (shares, Form 4)', '% of shares outstanding', `Value at ${nw('$' + fmt(B.close, 2))} close`, `Proxy beneficial ownership (${nw(P.own_as_of)})`, 'Unvested / deferred awards'];
  const notes = [],
    so = B.so;

/* ---------- routing ---------- */
const R = {
    overview,
    financials,
    revenue,
    cycle,
    'capacity-capex': capacityCapex,
    fabs: fabsHbm,
    buybacks,
    insiders,
    calls,
    estimates,
    competition,
    people,
    holders,
    catalysts,
    china,
    sources
  },
  done = {};
const ALIAS = {
  capacity: 'capacity-capex',
  capex: 'capacity-capex'
}; // old #capacity / #capex links land on the merged tab, at their section
function route() {
  let [t, sub] = (location.hash.slice(1) || 'overview').split('/');
  const anchor = ALIAS[t] ? t : null;
  if (anchor) {
    t = ALIAS[t];
    history.replaceState(null, '', '#' + t);
  }
  const tab = R[t] ? t : 'overview';
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 's-' + tab));
  document.querySelectorAll('nav a').forEach(a => a.classList.toggle('on', a.dataset.t === tab));
  if (tab === 'financials') financials(sub || 'is');else if (!done[tab]) {
    R[tab]();
    done[tab] = 1;
  }
  window.scrollTo(0, 0);
  if (anchor && anchor !== 'capacity') {
    const e = document.getElementById(anchor);
    if (e) e.scrollIntoView();
  }
  const nv = $('#nav'),
    o = nv && nv.querySelector('a.on');
  if (o) {
    const d = o.getBoundingClientRect().left - nv.getBoundingClientRect().left;
    nv.scrollLeft += d - (nv.clientWidth - o.offsetWidth) / 2;
  }
}
function chrome() {
  // static page chrome that depends on the language
  $('#nav').innerHTML = TABS.map(([k, en, zh]) => `<a href="#${k}" data-t="${k}">${L(en)}</a>`).join('');
  $('#bn').textContent = L('Dashboard');
  $('#h1').textContent = L('Micron Technology (MU) — Research Dashboard');
  document.querySelector('.brand').setAttribute('aria-label', L('Micron dashboard home'));

}

/* ---------- theme: Auto (system) → Light → Dark; choice kept in localStorage 'mu-theme' ---------- */
function applyTheme(rerender, skipTv) {
  const t = document.documentElement.dataset.theme || 'auto';
  $('#themelbl').textContent = t === 'auto' ? L('Auto') : t === 'dark' ? L('Dark') : L('Light');
  $('#themeic').textContent = t === 'auto' ? '◐' : t === 'dark' ? '☾' : '☀';
  $('#themebtn').title = L(`Theme: ${t === 'auto' ? 'follows your system' : t} · click to switch`);
  if (!rerender) return;
  DARK = isDark();
  chartTheme();
  palette();
  Object.keys(charts).forEach(k => {
    try {
      charts[k].destroy();
    } catch (e) {}
    delete charts[k];
  });
  // header: the live box follows CSS variables; re-embed the TradingView fallback quote if it is showing
  if (!skipTv) {
    const showing = $('#tvwrap') && $('#tvwrap').style.display === 'block';
    LQ.tv = false;
    if (showing) tvFallback(true);
  }
  for (const k in done) delete done[k];
  const y = scrollY;
  route();
  window.scrollTo(0, y);
}
$('#themebtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || 'auto';
  const nx = cur === 'auto' ? 'light' : cur === 'light' ? 'dark' : 'auto';
  if (nx === 'auto') {
    delete document.documentElement.dataset.theme;
    try {
      localStorage.removeItem('mu-theme');
    } catch (e) {}
  } else {
    document.documentElement.dataset.theme = nx;
    try {
      localStorage.setItem('mu-theme', nx);
    } catch (e) {}
  }
  applyTheme(true);
};
if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
  if (!document.documentElement.dataset.theme) applyTheme(true);
});
applyTheme(false);
header();
window.addEventListener('hashchange', route);
route();
